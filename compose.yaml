services:
  api:
    image: ghcr.io/liftedkilt/openchore/api:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: openchore-api
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - CONFIG_PATH=/app/config/config.yaml
      # Optional AI and read-aloud audio: both are off unless a base URL is
      # set. Any OpenAI-compatible server works; see docs/ai.md.
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - TTS_BASE_URL=${TTS_BASE_URL:-}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_MODEL=${TTS_MODEL:-}
      # Meals: read from the mealie service below. Create an API token in
      # Mealie (your profile → API Tokens), put it in .env as
      # MEALIE_API_TOKEN, then `docker compose up -d` again. See docs/meals.md.
      - MEALIE_URL=${MEALIE_URL:-http://mealie:9000}
      - MEALIE_API_TOKEN=${MEALIE_API_TOKEN:-}
      - MEALIE_PUBLIC_URL=${MEALIE_PUBLIC_URL:-http://localhost:9925}
    volumes:
      - openchore-data:/data
      - ./config:/app/config:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/users"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/liftedkilt/openchore/web:latest
    build:
      context: ./web
      dockerfile: Containerfile
    container_name: openchore-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Mealie, the recipe manager behind the Meals screen. It needs its own
  # address (it can't run under a sub-path), so it gets its own port. Its
  # colours are set to OpenChore's House theme.
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0
    container_name: openchore-mealie
    restart: unless-stopped
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    environment:
      - TZ=America/Los_Angeles
      - ALLOW_SIGNUP=false
      - BASE_URL=${MEALIE_PUBLIC_URL:-http://localhost:9925}
      - THEME_LIGHT_PRIMARY=#1a1a1c
      - THEME_LIGHT_ACCENT=#5e5c58
      - THEME_LIGHT_SECONDARY=#5e5c58
      - THEME_LIGHT_WARNING=#87580a
      - THEME_LIGHT_ERROR=#b3401a
      - THEME_DARK_PRIMARY=#31302b
      - THEME_DARK_ACCENT=#aba69d
      - THEME_DARK_SECONDARY=#aba69d
      - THEME_DARK_WARNING=#f0c46a
      - THEME_DARK_ERROR=#ff9a78
    volumes:
      - mealie-data:/app/data
    deploy:
      resources:
        limits:
          memory: 1000M

  # Optional: a local vision model for photo review, chore descriptions and
  # weekly summaries — Gemma 4 E4B on llama.cpp's server (~5 GB download on
  # first start, ~6 GB RAM). Enable with `docker compose --profile ai up -d`
  # and, in .env:
  #   AI_BASE_URL=http://llama:8080/v1
  #   AI_MODEL=gemma-4-e4b
  # Prefer Ollama, LM Studio or a hosted API? Point AI_BASE_URL there instead.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: openchore-llama
    restart: unless-stopped
    profiles:
      - ai
    command: ["-hf", "ggml-org/gemma-4-E4B-it-GGUF:Q4_0", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192"]
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - llama-models:/models
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 7G

  # Optional: read-aloud audio via Kokoro (~2 GB RAM). Enable with
  # `docker compose --profile tts up -d` and, in .env:
  #   TTS_BASE_URL=http://kokoro:8880/v1
  # Without it, chores are read aloud by the browser's built-in voice.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    container_name: openchore-kokoro
    restart: unless-stopped
    profiles:
      - tts
    volumes:
      - kokoro-data:/app/api/src/voices/v1_0
    expose:
      - "8880"
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  openchore-data:
  mealie-data:
  llama-models:
  kokoro-data:
